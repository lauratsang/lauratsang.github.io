<script>
const imagePaths = ['assets/cupcake.png'];
const colorSchemes = [
    { bg: '#FF006E', dot: '#FFFF00' },  // Hot pink & Yellow
    { bg: '#00F5FF', dot: '#FF4500' },  // Cyan & Orange-red
    { bg: '#7B2CBF', dot: '#00FF00' },  // Purple & Lime green
    { bg: '#FF9500', dot: '#0066FF' }   // Orange & Bright blue
];

window.onload = function () {
    colorSchemes.forEach((colors, index) => {
        const canvas = document.getElementById(`canvas${index + 1}`);
        loadImageAndDrawDots(canvas, colors);
    });
};

function loadImageAndDrawDots(canvas, colors) {
    const ctx = canvas.getContext('2d');
    const img = new Image();
    img.src = imagePaths[0];

    img.onload = function () {
        // Set canvas size
        const targetWidth = 300;
        canvas.width = targetWidth;
        canvas.height = targetWidth;

        // Draw image offscreen to read full data
        const offCanvas = document.createElement('canvas');
        offCanvas.width = img.width;
        offCanvas.height = img.height;
        const offCtx = offCanvas.getContext('2d');
        offCtx.drawImage(img, 0, 0);
        const imageData = offCtx.getImageData(0, 0, img.width, img.height);
        const data = imageData.data;

        // Compute uniform scale to preserve aspect ratio
        const scale = Math.min(canvas.width / img.width, canvas.height / img.height);
        const newWidth = img.width * scale;
        const newHeight = img.height * scale;
        const dx = (canvas.width - newWidth) / 2;
        const dy = (canvas.height - newHeight) / 2;

        // Generate dots
        const dots = [];
        const space = 8;
        for (let y = 0; y < img.height; y += space) {
            for (let x = 0; x < img.width; x += space) {
                const index = (y * img.width + x) * 4;
                const red = data[index];
                const green = data[index + 1];
                const blue = data[index + 2];
                const brightness = (red + green + blue) / 3;

                if (brightness > 0.7 * 255) continue;

                const dotSize = Math.max(2, 6 - (brightness / 255) * 6);

                dots.push({
                    x: x * scale + dx,
                    y: y * scale + dy,
                    size: dotSize * scale * 0.8
                });
            }
        }

        // Draw background
        ctx.fillStyle = colors.bg;
        ctx.fillRect(dx, dy, newWidth, newHeight);

        // Draw dots
        dots.forEach(dot => {
            ctx.fillStyle = colors.dot;
            ctx.beginPath();
            ctx.arc(dot.x, dot.y, dot.size, 0, Math.PI * 2);
            ctx.fill();
        });
    };
}
</script>
